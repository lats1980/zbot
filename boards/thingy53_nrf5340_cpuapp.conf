# =============================================================================
# Wi-Fi Driver & Credentials Storage
# Wi-Fi credentials are persisted in NVS on nRF5340 internal flash.
# Use ZMS instead of NVS on nRF54 series.
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
#CONFIG_ZMS=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# =============================================================================
# WPA Supplicant
# =============================================================================
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

# =============================================================================
# L2 Wi-Fi Connectivity Manager
# Automatically manages association; keeps interface up after connect.
# =============================================================================
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n

# =============================================================================
# Network Stack – Core Protocols
# =============================================================================
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=4

# =============================================================================
# Network Sockets Options
# =============================================================================
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_ZVFS_POLL_MAX=20

# =============================================================================
# Network Buffers
# Tuned for higher throughput; overrides the initial conservative defaults.
# =============================================================================
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=24000
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=16000

# =============================================================================
# nRF70 Wi-Fi Driver Tuning
# =============================================================================
CONFIG_NRF70_AP_MODE=n
CONFIG_NRF70_P2P_MODE=n
CONFIG_NRF70_QSPI_LOW_POWER=n
CONFIG_NRF70_UTIL=n
CONFIG_NRF70_RX_NUM_BUFS=48
CONFIG_NRF70_MAX_TX_AGGREGATION=4
CONFIG_NRF70_MAX_TX_TOKENS=5
#CONFIG_SPEED_OPTIMIZATIONS=y          # Disabled on nRF5340; enabled on nRF54 series

# =============================================================================
# TLS / mbedTLS
# Legacy crypto symbols are needed for TF-M NS builds because
# config_adjust_legacy_from_psa.h is gated behind MBEDTLS_PSA_CRYPTO_C
# (not set on NS side), so MBEDTLS_ECDH_C, MBEDTLS_ECDSA_C, MBEDTLS_RSA_C
# etc. are never auto-derived from PSA_WANT_*. Without them the OID sig-alg
# table and TLS supported_groups are incomplete.
# =============================================================================
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_CREDENTIALS_BACKEND_VOLATILE=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y

# =============================================================================
# Shell
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_CMDS_RESIZE=n
#CONFIG_NET_L2_WIFI_SHELL=y

# =============================================================================
# Kernel / POSIX Options
# Disable unused POSIX subsystems to reduce ROM/RAM footprint.
# =============================================================================
CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_FD_MGMT=n
CONFIG_POSIX_MESSAGE_PASSING=n
CONFIG_POSIX_THREAD_THREADS_MAX=0

# =============================================================================
# Stack Sizes
# MAIN and SHELL are enlarged because select/poll consume extra stack.
# =============================================================================
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4600
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_NRF70_IRQ_WQ_STACK_SIZE=1024
CONFIG_NRF70_BH_WQ_STACK_SIZE=2300
CONFIG_ISR_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200

# =============================================================================
# Heap Sizes
# HEAP_MEM_POOL_IGNORE_MIN suppresses the linker error when the combined
# pool size exceeds the nRF5340 internal RAM minimum threshold.
# =============================================================================
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=37000
CONFIG_MBEDTLS_HEAP_SIZE=100000
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=15000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=100000

# =============================================================================
# Network Logging / Debug
# =============================================================================
#CONFIG_LOG=y
CONFIG_NET_LOG=y
#CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
#CONFIG_NET_HTTP_LOG_LEVEL_DBG=n
#CONFIG_NET_IPV6_LOG_LEVEL_DBG=n
#CONFIG_NET_IPV6_ND_LOG_LEVEL_DBG=n


# Buzzer (PWM)
CONFIG_PWM=y

# Battery measurement (ADC)
CONFIG_ADC=y

# Power profiling
#CONFIG_AVERAGE_CURRENT_CONSUMPTION=10000

# UART console and shell
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n

# USB CDC ACM
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Nordic Semiconductor ASA"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Thingy:53 Matter Weather"
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x530D
CONFIG_UART_LINE_CTRL=y

# NVS settings partition size (64 kB for this application on Thingy:53)
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16

CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_I2C=y

CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512

# --- BME680/BME688 Environment Sensor ---
CONFIG_SENSOR=y
CONFIG_BME680=y